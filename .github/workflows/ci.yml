name: Continuous Integration

on:
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload the standalone build for a deploy job in the same run
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Baked into the client bundle at build time; configure as a repository variable.
  NEXT_PUBLIC_baseURL: ${{ vars.NEXT_PUBLIC_baseURL }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock') }}-

      - name: Build ☕️
        run: bun run build

      - name: Test
        run: bunx vitest run

      # Only needed by the deploy job; pull request runs do not consume it.
      - name: Upload build artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next/standalone
            .next/static
            public
            pm2.config.cjs
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
