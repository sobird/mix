name: deploy

on:
  workflow_call:
    inputs:
      build:
        description: Build from source instead of downloading CI artifacts
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build:
        description: Build from source (no CI artifacts are available when run manually)
        type: boolean
        default: true

permissions:
  contents: read

# Never let two releases write to the same deployment directory concurrently.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_PORT: 8085
  # Baked into the client bundle at build time; configure as a repository variable.
  NEXT_PUBLIC_baseURL: ${{ vars.NEXT_PUBLIC_baseURL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up
        if: inputs.build
        uses: ./.github/actions/setup

      - name: Build ☕️
        if: inputs.build
        run: bun run build

      - name: Build db tools
        if: inputs.build
        run: bun run build:db-tools

      - name: Download build artifacts
        if: ${{ !inputs.build }}
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .

      # Assemble the standalone server the way Next.js expects it:
      # .next/static and public are not copied into the standalone output.
      - name: Prepare release bundle
        run: |
          set -euo pipefail
          cp pm2.config.cjs .next/standalone/
          cp dist/db-tools.cjs .next/standalone/
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload release bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: release.tar.gz,scripts/deploy.sh
          target: ${{ secrets.TARGET }}
          overwrite: true

      - name: Deploy release
        uses: appleboy/ssh-action@v1
        env:
          APP_ROOT: ${{ secrets.TARGET }}
          APP_PORT: ${{ env.APP_PORT }}
          RELEASES_DIR: ${{ vars.RELEASES_DIR }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          AUTHMAIL: ${{ secrets.AUTHMAIL }}
          AUTHCODE: ${{ secrets.AUTHCODE }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 5m
          envs: APP_ROOT,APP_PORT,RELEASES_DIR,RELEASE_ID,AUTHMAIL,AUTHCODE
          script: bash "$APP_ROOT/scripts/deploy.sh"
